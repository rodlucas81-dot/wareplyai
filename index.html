<script>
// This page is aimed at Portuguese speakers, so it opens in Portuguese
// regardless of browser locale. ?lang=en opens it in English, and the choice
// carries through to the application so nobody gets switched mid-flow.
function initialLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "pt") return q;
  } catch (e) { /* no URLSearchParams support — fall through to the default */ }
  return "pt";
}

const state = { lang: initialLang() };

function t(key) {
  return i18n[state.lang][key] || i18n.pt[key] || key;
}

function applyUrl() {
  // Carry the language across so an English visitor stays in English.
  return CONFIG.applyUrl + (state.lang === "en" ? "?lang=en" : "");
}

function render() {
  document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
  document.getElementById("brand-img").src = CONFIG.loHeadshot;
  document.getElementById("brand-name").textContent = CONFIG.loName;
  document.getElementById("brand-title").textContent = CONFIG.loTitle + " · " + CONFIG.nmls;
  document.getElementById("lang-btn").textContent = t("langSwitch");
  document.getElementById("app").innerHTML = renderPage();
  document.getElementById("site-footer").innerHTML = renderFooter();
  document.getElementById("lang-btn").onclick = () => {
    state.lang = state.lang === "pt" ? "en" : "pt";
    render();
  };
}

function renderPage() {
  const prog = [
    ["progConv", "progConvSub"], ["progFHA", "progFHASub"],
    ["progVA", "progVASub"], ["progITIN", "progITINSub"],
    ["progBank", "progBankSub"], ["progDSCR", "progDSCRSub"],
    ["progForeign", "progForeignSub"], ["progRefi", "progRefiSub"],
  ];
  return `
    <section class="hero">
      <span class="badge">${t("badge")}</span>
      <h1>${t("heroTitle")}</h1>
      <p class="sub">${t("heroSub")}</p>

      <a class="btn-primary" href="${applyUrl()}">${t("ctaPrimary")}</a>
      <p class="cta-sub">${t("ctaPrimarySub")}</p>

      <div class="btn-row">
        <a class="btn-secondary" href="https://wa.me/${CONFIG.loWhatsApp}" target="_blank" rel="noopener">${t("ctaWhats")}</a>
        <a class="btn-secondary" href="tel:${CONFIG.loPhoneTel}">${t("ctaCall")}</a>
      </div>

      <div class="trust-row">
        <div class="trust-pill"><span class="dot">●</span><strong>${t("trust1")}</strong><span>${t("trust1Sub")}</span></div>
        <div class="trust-pill"><span class="dot">●</span><strong>${t("trust2")}</strong><span>${t("trust2Sub")}</span></div>
        <div class="trust-pill"><span class="dot">●</span><strong>${t("trust3")}</strong><span>${t("trust3Sub")}</span></div>
      </div>
    </section>

    <section class="block">
      <h2>${t("howHeader")}</h2>
      <div class="steps">
        <div class="step-card"><h3>${t("how1Title")}</h3><p>${t("how1Body")}</p></div>
        <div class="step-card"><h3>${t("how2Title")}</h3><p>${t("how2Body")}</p></div>
        <div class="step-card"><h3>${t("how3Title")}</h3><p>${t("how3Body")}</p></div>
      </div>
    </section>

    <section class="block">
      <h2>${t("programsHeader")}</h2>
      <p class="lead">${t("programsSub")}</p>
      <div class="prog-grid">
        ${prog.map(([n, s]) => `<div class="prog"><strong>${t(n)}</strong><span>${t(s)}</span></div>`).join("")}
      </div>
    </section>

    <section class="block">
      <h2>${t("contactHeader")}</h2>
      <p class="lead">${t("contactSub")}</p>
      <div class="contact-grid">
        <a class="contact-card" href="tel:${CONFIG.loPhoneTel}">
          <span class="lbl">${t("contactPhone")}</span><span class="val">${CONFIG.loPhone}</span></a>
        <a class="contact-card" href="https://wa.me/${CONFIG.loWhatsApp}" target="_blank" rel="noopener">
          <span class="lbl">${t("contactWhats")}</span><span class="val">${CONFIG.loPhone}</span></a>
        <a class="contact-card" href="mailto:${CONFIG.loEmail}">
          <span class="lbl">${t("contactEmail")}</span><span class="val">${CONFIG.loEmail}</span></a>
        <a class="contact-card" href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">
          <span class="lbl">${t("contactInsta")}</span><span class="val">@rodmortgage</span></a>
      </div>
      <div class="btn-row" style="grid-template-columns:1fr;">
        <a class="btn-secondary" href="${CONFIG.calendarShareUrl}" target="_blank" rel="noopener">${t("contactBook")}</a>
      </div>
    </section>

    <section class="final">
      <h2>${t("finalCta")}</h2>
      <p>${t("finalCtaSub")}</p>
      <a class="btn-primary" href="${applyUrl()}">${t("ctaPrimary")}</a>
    </section>

    <div class="legal-notice">${t("notAppNote")}</div>
  `;
}

    <rect width="120" height="120" fill="#000"/>

    <rect x="22" y="52" width="76" height="44" fill="#fff"/>
    <rect x="42" y="64" width="36" height="6" fill="#000"/>
    <rect x="42" y="78" width="36" height="6" fill="#000"/>
    <rect x="0" y="96" width="120" height="24" fill="#000"/>
    <text x="60" y="106" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">EQUAL HOUSING</text>
    <text x="60" y="116" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">LENDER</text>

}

        </div>

          <div class="label">${t("footerCompany")}</div>

render();
</script>
</body>
